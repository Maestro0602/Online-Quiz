<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg-home { fill: #086288; }
      .nav-bar { fill: rgba(0,0,0,0.2); }
      .brand-txt { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
      .card-white { fill: #ffffff; rx: 16; }
      .card-title { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .sub-title { font-family: 'Inter', sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; }
      .pin-input { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .pin-text { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; fill: #0f172a; text-anchor: middle; letter-spacing: 6px; }
      .btn-primary { fill: #4882ab; rx: 10; filter: url(#drop); }
      .btn-txt { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .badge-chip { fill: #e0f2fe; rx: 12; }
      .chip-txt { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
    </style>
    <filter id="drop">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="rgba(0,0,0,0.25)" />
    </filter>
  </defs>

  <rect width="1440" height="900" class="bg-home" />

  <!-- TOP NAVBAR -->
  <rect width="1440" height="70" class="nav-bar" />
  <g transform="translate(80, 22)">
    <text x="0" y="24" class="brand-txt">qiuizez</text>
    <!-- Nav buttons -->
    <rect x="1050" y="2" width="100" height="36" rx="8" fill="rgba(255,255,255,0.15)" />
    <text x="1100" y="25" class="btn-txt" font-size="13px">Sign In</text>

    <!-- Theme indicator -->
    <rect x="1170" y="2" width="110" height="36" rx="8" fill="#ffffff" filter="url(#drop)" />
    <circle cx="1186" cy="20" r="7" fill="#086288" />
    <text x="1232" y="25" font-family="'Inter', sans-serif" font-size="13px" font-weight="700" fill="#0f172a" text-anchor="middle">Ocean Blue</text>
  </g>

  <!-- CENTER JOIN CARD -->
  <g transform="translate(480, 180)">
    <rect width="480" height="490" class="card-white" filter="url(#drop)" />

    <!-- Card Header -->
    <text x="240" y="55" class="card-title">Join a Team Quiz</text>
    <text x="240" y="85" class="sub-title">Enter the 6-digit game PIN from the projector screen</text>

    <!-- PIN input -->
    <rect x="60" y="120" width="360" height="65" class="pin-input" />
    <text x="240" y="162" class="pin-text">7 3 9 2 1 8</text>

    <!-- Nickname input -->
    <text x="60" y="220" font-family="'Inter', sans-serif" font-size="13px" font-weight="600" fill="#334155">Player Nickname / Student Name</text>
    <rect x="60" y="235" width="360" height="50" class="pin-input" />
    <text x="80" y="267" font-family="'Inter', sans-serif" font-size="15px" fill="#0f172a">Alex Rivera</text>

    <!-- Join Button -->
    <g transform="translate(60, 315)">
      <rect width="360" height="52" class="btn-primary" />
      <text x="180" y="26" class="btn-txt">Join Game &amp; Get Team</text>
    </g>

    <line x1="60" y1="395" x2="420" y2="395" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Host shortcut -->
    <text x="240" y="430" class="sub-title">Are you an instructor or host?</text>
    <text x="240" y="455" font-family="'Inter', sans-serif" font-size="14px" font-weight="700" fill="#086288" text-anchor="middle">Sign in to Host a Quiz Session →</text>
  </g>
</svg>
