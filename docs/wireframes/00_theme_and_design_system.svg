<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <style>
      .bg-base { fill: #086288; }
      .card-cream { fill: #fee6ba; stroke: #4882ab; stroke-width: 2; rx: 14; }
      .card-sage { fill: #d1e8cf; stroke: #859b7d; stroke-width: 2; rx: 12; }
      .card-mono { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 12; }
      .card-classic { fill: #ffffff; stroke: #46178f; stroke-width: 2; rx: 12; }
      .title-cream { font-family: 'Fredoka', 'Montserrat', sans-serif; font-size: 30px; font-weight: 800; fill: #fee6ba; }
      .sub-sky { font-family: 'Fredoka', 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; fill: #93d0f8; }
      .sec-hdr { font-family: 'Fredoka', 'Montserrat', sans-serif; font-size: 19px; font-weight: 800; fill: #086288; }
      .token-lbl { font-family: 'Fredoka', 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; fill: #086288; }
      .token-hex { font-family: 'Montserrat', monospace; font-size: 11px; font-weight: 700; fill: #4882ab; }
      .btn-txt { font-family: 'Fredoka', 'Montserrat', sans-serif; font-size: 15px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <filter id="btn3d" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="rgba(0,0,0,0.28)" />
    </filter>
    <filter id="cardElev" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.25)" />
    </filter>
  </defs>

  <!-- App Background: var(--theme-bg-base) = #086288 -->
  <rect width="1440" height="960" class="bg-base" />

  <!-- Top Navbar Replica from App.vue -->
  <rect width="1440" height="68" fill="#086288" />
  <line x1="0" y1="68" x2="1440" y2="68" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <g transform="translate(120, 18)">
    <text x="0" y="24" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#fee6ba">qiuizez</text>
    <text x="160" y="22" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="700" fill="rgba(255,255,255,0.9)">Design System &amp; 4-Theme CSS Variable Spec (`main.css` + `App.vue`)</text>
    <rect x="1030" y="0" width="170" height="34" rx="8" fill="transparent" stroke="#4882ab" stroke-width="1.5" />
    <text x="1115" y="18" font-family="'Fredoka', sans-serif" font-size="13px" font-weight="700" fill="#fee6ba" text-anchor="middle" dominant-baseline="middle">Ocean (Default)  ▼</text>
  </g>

  <!-- SECTION 1: THE 4 LIVE THEMES (EXACT CSS VARIABLES FROM main.css) -->
  <g transform="translate(60, 95)">
    <!-- THEME 1: [data-theme="ocean"] (Default) -->
    <g transform="translate(0, 0)">
      <rect width="315" height="275" rx="14" fill="#086288" stroke="#93d0f8" stroke-width="2" filter="url(#cardElev)" />
      <!-- Inner .card-kahoot preview -->
      <rect x="16" y="16" width="283" height="243" class="card-cream" />
      <text x="32" y="46" class="sec-hdr">1. Ocean (Default)</text>
      <text x="32" y="64" class="token-hex">[data-theme="ocean"]</text>

      <!-- Swatches -->
      <g transform="translate(32, 78)">
        <rect x="0" y="0" width="54" height="42" rx="6" fill="#086288" stroke="#4882ab" />
        <text x="0" y="56" class="token-lbl">--bg-base</text>
        <text x="0" y="69" class="token-hex">#086288</text>

        <rect x="65" y="0" width="54" height="42" rx="6" fill="#fee6ba" stroke="#4882ab" />
        <text x="65" y="56" class="token-lbl">--card-bg</text>
        <text x="65" y="69" class="token-hex">#fee6ba</text>

        <rect x="130" y="0" width="54" height="42" rx="6" fill="#4882ab" />
        <text x="130" y="56" class="token-lbl">--border</text>
        <text x="130" y="69" class="token-hex">#4882ab</text>

        <rect x="195" y="0" width="54" height="42" rx="6" fill="#93d0f8" />
        <text x="195" y="56" class="token-lbl">--accent</text>
        <text x="195" y="69" class="token-hex">#93d0f8</text>
      </g>

      <!-- Live Button Sample -->
      <g transform="translate(32, 168)">
        <rect width="120" height="40" rx="8" fill="#086288" filter="url(#btn3d)" />
        <text x="60" y="20" class="btn-txt" fill="#fee6ba">Enter Room</text>

        <rect x="132" y="0" width="118" height="40" rx="8" fill="#fee6ba" stroke="#4882ab" stroke-width="1.5" filter="url(#btn3d)" />
        <text x="191" y="20" class="btn-txt" fill="#086288">Host</text>
      </g>
      <text x="32" y="238" class="token-hex">Card Text: #086288  |  Logo: #fee6ba</text>
    </g>

    <!-- THEME 2: [data-theme="sage"] -->
    <g transform="translate(335, 0)">
      <rect width="315" height="275" rx="14" fill="#5b6c54" stroke="#acc5a6" stroke-width="2" filter="url(#cardElev)" />
      <rect x="16" y="16" width="283" height="243" class="card-sage" />
      <text x="32" y="46" font-family="'Fredoka', sans-serif" font-size="19px" font-weight="800" fill="#5b6c54">2. Sage Green</text>
      <text x="32" y="64" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#859b7d">[data-theme="sage"]</text>

      <g transform="translate(32, 78)">
        <rect x="0" y="0" width="54" height="42" rx="6" fill="#5b6c54" />
        <text x="0" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#5b6c54">--bg-base</text>
        <text x="0" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#859b7d">#5b6c54</text>

        <rect x="65" y="0" width="54" height="42" rx="6" fill="#d1e8cf" stroke="#859b7d" />
        <text x="65" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#5b6c54">--card-bg</text>
        <text x="65" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#859b7d">#d1e8cf</text>

        <rect x="130" y="0" width="54" height="42" rx="6" fill="#859b7d" />
        <text x="130" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#5b6c54">--border</text>
        <text x="130" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#859b7d">#859b7d</text>

        <rect x="195" y="0" width="54" height="42" rx="6" fill="#acc5a6" />
        <text x="195" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#5b6c54">--logo</text>
        <text x="195" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#859b7d">#acc5a6</text>
      </g>

      <g transform="translate(32, 168)">
        <rect width="120" height="40" rx="8" fill="#5b6c54" filter="url(#btn3d)" />
        <text x="60" y="20" class="btn-txt" fill="#d1e8cf">Enter Room</text>

        <rect x="132" y="0" width="118" height="40" rx="8" fill="#d1e8cf" stroke="#859b7d" stroke-width="1.5" filter="url(#btn3d)" />
        <text x="191" y="20" class="btn-txt" fill="#5b6c54">Host</text>
      </g>
      <text x="32" y="238" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#5b6c54">Card Text: #5b6c54  |  Logo: #acc5a6</text>
    </g>

    <!-- THEME 3: [data-theme="monochrome"] -->
    <g transform="translate(670, 0)">
      <rect width="315" height="275" rx="14" fill="#000000" stroke="#ffffff" stroke-width="2" filter="url(#cardElev)" />
      <rect x="16" y="16" width="283" height="243" class="card-mono" />
      <text x="32" y="46" font-family="'Fredoka', sans-serif" font-size="19px" font-weight="800" fill="#000000">3. Black &amp; White</text>
      <text x="32" y="64" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#333333">[data-theme="monochrome"]</text>

      <g transform="translate(32, 78)">
        <rect x="0" y="0" width="54" height="42" rx="6" fill="#000000" />
        <text x="0" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#000000">--bg-base</text>
        <text x="0" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#333333">#000000</text>

        <rect x="65" y="0" width="54" height="42" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="65" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#000000">--card-bg</text>
        <text x="65" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#333333">#ffffff</text>

        <rect x="130" y="0" width="54" height="42" rx="6" fill="#000000" />
        <text x="130" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#000000">--border</text>
        <text x="130" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#333333">#000000</text>

        <rect x="195" y="0" width="54" height="42" rx="6" fill="#1a1a1a" />
        <text x="195" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#000000">--hover</text>
        <text x="195" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#333333">#1a1a1a</text>
      </g>

      <g transform="translate(32, 168)">
        <rect width="120" height="40" rx="8" fill="#000000" filter="url(#btn3d)" />
        <text x="60" y="20" class="btn-txt" fill="#ffffff">Enter Room</text>

        <rect x="132" y="0" width="118" height="40" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#btn3d)" />
        <text x="191" y="20" class="btn-txt" fill="#000000">Host</text>
      </g>
      <text x="32" y="238" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#000000">Card Text: #000000  |  Logo: #ffffff</text>
    </g>

    <!-- THEME 4: [data-theme="classic"] -->
    <g transform="translate(1005, 0)">
      <rect width="315" height="275" rx="14" fill="#46178f" stroke="#ffa602" stroke-width="2" filter="url(#cardElev)" />
      <rect x="16" y="16" width="283" height="243" class="card-classic" />
      <text x="32" y="46" font-family="'Fredoka', sans-serif" font-size="19px" font-weight="800" fill="#46178f">4. Classic Purple</text>
      <text x="32" y="64" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#46178f">[data-theme="classic"]</text>

      <g transform="translate(32, 78)">
        <rect x="0" y="0" width="54" height="42" rx="6" fill="#46178f" />
        <text x="0" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#222222">--bg-base</text>
        <text x="0" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#46178f">#46178f</text>

        <rect x="65" y="0" width="54" height="42" rx="6" fill="#320f6b" />
        <text x="65" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#222222">--navbar</text>
        <text x="65" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#46178f">#320f6b</text>

        <rect x="130" y="0" width="54" height="42" rx="6" fill="#ffffff" stroke="#46178f" />
        <text x="130" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#222222">--card-bg</text>
        <text x="130" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#46178f">#ffffff</text>

        <rect x="195" y="0" width="54" height="42" rx="6" fill="#ffa602" />
        <text x="195" y="56" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#222222">--btn-pri</text>
        <text x="195" y="69" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#46178f">#ffa602</text>
      </g>

      <g transform="translate(32, 168)">
        <rect width="120" height="40" rx="8" fill="#ffa602" filter="url(#btn3d)" />
        <text x="60" y="20" class="btn-txt" fill="#ffffff">Enter Room</text>

        <rect x="132" y="0" width="118" height="40" rx="8" fill="#ffffff" stroke="#46178f" stroke-width="1.5" filter="url(#btn3d)" />
        <text x="191" y="20" class="btn-txt" fill="#222222">Host</text>
      </g>
      <text x="32" y="238" font-family="'Montserrat', monospace" font-size="11px" font-weight="700" fill="#222222">Card Text: #222222  |  Logo: #ffffff</text>
    </g>
  </g>

  <!-- SECTION 2: KAHOOT SHAPE ANSWER CARDS & TEAM PRESETS -->
  <g transform="translate(60, 395)">
    <rect width="790" height="250" class="card-cream" filter="url(#cardElev)" />
    <text x="28" y="38" class="sec-hdr">Kahoot 4-Shape Answer Cards (`.opt-card` / `.kahoot-btn`)</text>

    <g transform="translate(28, 56)">
      <!-- Red Triangle -->
      <g transform="translate(0, 0)">
        <rect width="355" height="75" rx="12" fill="#e21b3c" filter="url(#btn3d)" />
        <text x="32" y="45" font-family="'Fredoka', sans-serif" font-size="28px" font-weight="900" fill="#ffffff">▲</text>
        <text x="72" y="44" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="700" fill="#ffffff">Type Annotations &amp; Interfaces</text>
      </g>

      <!-- Blue Diamond -->
      <g transform="translate(375, 0)">
        <rect width="355" height="75" rx="12" fill="#1368ce" filter="url(#btn3d)" />
        <text x="32" y="45" font-family="'Fredoka', sans-serif" font-size="28px" font-weight="900" fill="#ffffff">◆</text>
        <text x="72" y="44" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="700" fill="#ffffff">Classes &amp; Prototypes</text>
      </g>

      <!-- Yellow Circle (Dark #222 text per .opt-yellow) -->
      <g transform="translate(0, 95)">
        <rect width="355" height="75" rx="12" fill="#d88b02" filter="url(#btn3d)" />
        <text x="32" y="45" font-family="'Fredoka', sans-serif" font-size="28px" font-weight="900" fill="#222222">●</text>
        <text x="72" y="44" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="700" fill="#222222">Async / Await Promises</text>
      </g>

      <!-- Green Square -->
      <g transform="translate(375, 95)">
        <rect width="355" height="75" rx="12" fill="#26890c" filter="url(#btn3d)" />
        <text x="32" y="45" font-family="'Fredoka', sans-serif" font-size="28px" font-weight="900" fill="#ffffff">■</text>
        <text x="72" y="44" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="700" fill="#ffffff">JSON Schema Validators</text>
      </g>
    </g>

    <!-- TEAM PRESETS & BUTTONS CARD -->
    <g transform="translate(815, 0)">
      <rect width="505" height="250" class="card-cream" filter="url(#cardElev)" />
      <text x="28" y="38" class="sec-hdr">Team Presets (`store.ts`) &amp; Button Variants</text>

      <!-- Team Pills -->
      <g transform="translate(28, 58)">
        <rect x="0" y="0" width="215" height="36" rx="18" fill="#fafafa" stroke="#e21b3c" stroke-width="2" />
        <text x="107" y="23" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="800" fill="#e21b3c" text-anchor="middle">[R] Red Rockets (#e21b3c)</text>

        <rect x="230" y="0" width="215" height="36" rx="18" fill="#fafafa" stroke="#1368ce" stroke-width="2" />
        <text x="337" y="23" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="800" fill="#1368ce" text-anchor="middle">[B] Blue Blasters (#1368ce)</text>

        <rect x="0" y="48" width="215" height="36" rx="18" fill="#fafafa" stroke="#d88b02" stroke-width="2" />
        <text x="107" y="71" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="800" fill="#d88b02" text-anchor="middle">[G] Golden Geeks (#d88b02)</text>

        <rect x="230" y="48" width="215" height="36" rx="18" fill="#fafafa" stroke="#26890c" stroke-width="2" />
        <text x="337" y="71" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="800" fill="#26890c" text-anchor="middle">[V] Green Giants (#26890c)</text>
      </g>

      <!-- Utility Buttons (.btn-primary, .btn-yellow, .btn-red, .btn-white) -->
      <g transform="translate(28, 165)">
        <rect x="0" y="0" width="105" height="42" rx="8" fill="#086288" filter="url(#btn3d)" />
        <text x="52" y="21" class="btn-txt" fill="#fee6ba">.btn-primary</text>

        <rect x="115" y="0" width="105" height="42" rx="8" fill="#ffa602" filter="url(#btn3d)" />
        <text x="167" y="21" class="btn-txt" fill="#222222">.btn-yellow</text>

        <rect x="230" y="0" width="105" height="42" rx="8" fill="#e21b3c" filter="url(#btn3d)" />
        <text x="282" y="21" class="btn-txt" fill="#ffffff">.btn-red</text>

        <rect x="345" y="0" width="105" height="42" rx="8" fill="#ffffff" filter="url(#btn3d)" />
        <text x="397" y="21" class="btn-txt" fill="#46178f">.btn-white</text>
      </g>
    </g>
  </g>

  <!-- SECTION 3: TYPOGRAPHY & COMPONENT TOKENS -->
  <g transform="translate(60, 670)">
    <rect width="1320" height="230" class="card-cream" filter="url(#cardElev)" />
    <text x="28" y="38" class="sec-hdr">Typography (`Fredoka` &amp; `Montserrat`) &amp; Component Tokens</text>

    <g transform="translate(28, 68)">
      <text x="0" y="24" font-family="'Fredoka', sans-serif" font-size="34px" font-weight="800" fill="#086288">qiuizez — Hero Title 2.6rem (800 Bold) &amp; Giant PIN 3.8rem (900 Black)</text>
      <text x="0" y="64" font-family="'Fredoka', sans-serif" font-size="24px" font-weight="800" fill="#086288">Section Header / Question Prompt 2.0rem (800 Bold)</text>
      <text x="0" y="100" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="700" fill="#086288">Button &amp; Input Text 1.1rem – 1.3rem (700 Bold) — Tactile `box-shadow: 0 4px 0 rgba(0,0,0,0.25)`</text>
      <text x="0" y="132" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="600" fill="#4882ab">Meta Badges, Role Pills &amp; Student Roster Chips 0.85rem – 0.95rem (700 Bold)</text>
    </g>
  </g>
</svg>
