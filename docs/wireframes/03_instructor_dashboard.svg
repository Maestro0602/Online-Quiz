<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <filter id="btn3d" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="rgba(0,0,0,0.25)" />
    </filter>
    <filter id="cardElev" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.25)" />
    </filter>
  </defs>

  <!-- App Background: var(--theme-bg-base) = #086288 -->
  <rect width="1440" height="900" fill="#086288" />

  <!-- .kahoot-navbar (Authenticated Instructor State from App.vue) -->
  <rect width="1440" height="68" fill="#086288" />
  <line x1="0" y1="68" x2="1440" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <g transform="translate(120, 14)">
    <text x="0" y="29" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#fee6ba">qiuizez</text>

    <g transform="translate(460, 0)">
      <text x="45" y="26" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="600" fill="rgba(255,255,255,0.85)" text-anchor="middle">Join Game</text>

      <!-- Active link: Instructor Dashboard -->
      <rect x="105" y="4" width="175" height="34" rx="6" fill="rgba(255,255,255,0.18)" />
      <text x="192" y="26" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="700" fill="#ffffff" text-anchor="middle">Instructor Dashboard</text>

      <!-- + New Quiz (.btn-nav-action) -->
      <rect x="292" y="4" width="102" height="34" rx="6" fill="#086288" stroke="#4882ab" stroke-width="1.5" />
      <text x="343" y="26" font-family="'Fredoka', sans-serif" font-size="14.5px" font-weight="700" fill="#fee6ba" text-anchor="middle">+ New Quiz</text>

      <!-- .user-pill -->
      <rect x="408" y="0" width="218" height="42" rx="21" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)" />
      <text x="430" y="27" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="800" fill="#ffffff">A</text>
      <text x="452" y="19" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#ffffff">Prof. Ada Lovelace</text>
      <text x="452" y="33" font-family="'Fredoka', sans-serif" font-size="10px" font-weight="800" fill="#fee6ba">INSTRUCTOR</text>
      <text x="595" y="26" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="800" fill="rgba(255,255,255,0.75)" text-anchor="middle">Logout</text>

      <!-- Theme Switcher -->
      <rect x="638" y="4" width="142" height="34" rx="8" fill="transparent" stroke="#4882ab" stroke-width="1.5" />
      <text x="709" y="26" font-family="'Fredoka', sans-serif" font-size="13px" font-weight="700" fill="#fee6ba" text-anchor="middle">Ocean (Default) ▼</text>
    </g>
  </g>

  <!-- .dashboard-container (max-width: 1100px, centered at x=170) -->
  <g transform="translate(170, 100)">
    <!-- .dashboard-header -->
    <g transform="translate(0, 0)">
      <!-- .badge-role -->
      <rect x="0" y="0" width="215" height="26" rx="13" fill="rgba(255,166,2,0.25)" stroke="#ffa602" stroke-width="1" />
      <text x="107" y="17" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="800" fill="#ffa602" text-anchor="middle">INSTRUCTOR CONTROL CENTER</text>

      <text x="0" y="60" font-family="'Fredoka', sans-serif" font-size="35px" font-weight="800" fill="#ffffff">My Quizzes</text>
      <text x="0" y="84" font-family="'Fredoka', sans-serif" font-size="16px" font-weight="500" fill="rgba(255,255,255,0.75)">Create quizzes, launch collaborative live team battles, and track champions</text>

      <!-- + Create New Quiz (.btn-kahoot .btn-primary) -->
      <g transform="translate(910, 26)">
        <rect width="190" height="46" rx="8" fill="#086288" stroke="#4882ab" stroke-width="1.5" filter="url(#btn3d)" />
        <text x="95" y="29" font-family="'Fredoka', sans-serif" font-size="17px" font-weight="700" fill="#fee6ba" text-anchor="middle">+ Create New Quiz</text>
      </g>
    </g>

    <!-- .quiz-grid (2 cards side by side, matching defaultQuizzes in store.ts) -->
    <g transform="translate(0, 118)">
      <!-- QUIZ CARD 1: Computer Science & Web Dev Showdown -->
      <g transform="translate(0, 0)">
        <rect width="535" height="270" rx="12" fill="#fee6ba" stroke="#4882ab" stroke-width="1.5" filter="url(#cardElev)" />
        <!-- border-top: 6px solid #46178f -->
        <path d="M 10 0 L 525 0 Q 535 0 535 10 L 535 6 L 0 6 L 0 10 Q 0 0 10 0 Z" fill="#46178f" />

        <!-- .card-top -->
        <rect x="24" y="24" width="84" height="24" rx="12" fill="#e8f5e9" />
        <text x="66" y="40" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="800" fill="#2e7d32" text-anchor="middle">PUBLISHED</text>
        <text x="511" y="40" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#666666" text-anchor="end">5 Questions</text>

        <!-- .quiz-title & .quiz-desc -->
        <text x="24" y="78" font-family="'Fredoka', sans-serif" font-size="20px" font-weight="800" fill="#222222">Computer Science &amp; Web Dev Showdown</text>
        <text x="24" y="106" font-family="'Fredoka', sans-serif" font-size="14.5px" font-weight="500" fill="#666666">Test your knowledge on TypeScript, Vue 3, algorithms, and</text>
        <text x="24" y="126" font-family="'Fredoka', sans-serif" font-size="14.5px" font-weight="500" fill="#666666">browser wizardry!</text>

        <!-- .quiz-meta -->
        <rect x="24" y="150" width="487" height="36" rx="6" fill="#f9f9f9" />
        <text x="36" y="173" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#555555">Duration: 90s Total     Points: 5000 Pts</text>

        <!-- .card-footer -->
        <line x1="24" y1="202" x2="511" y2="202" stroke="#eeeeee" stroke-width="1" />
        <g transform="translate(24, 214)">
          <!-- .btn-launch -->
          <rect width="235" height="40" rx="8" fill="#086288" filter="url(#btn3d)" />
          <text x="117" y="25" font-family="'Fredoka', sans-serif" font-size="15.5px" font-weight="700" fill="#fee6ba" text-anchor="middle">Launch Game</text>

          <!-- .icon-actions (Edit, Unpublish, Delete) -->
          <rect x="250" y="3" width="58" height="34" rx="6" fill="#f0f0f0" stroke="#dddddd" />
          <text x="279" y="25" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#333333" text-anchor="middle">Edit</text>

          <rect x="314" y="3" width="90" height="34" rx="6" fill="#f0f0f0" stroke="#dddddd" />
          <text x="359" y="25" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#333333" text-anchor="middle">Unpublish</text>

          <rect x="410" y="3" width="77" height="34" rx="6" fill="#f0f0f0" stroke="#dddddd" />
          <text x="448" y="25" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#333333" text-anchor="middle">Delete</text>
        </g>
      </g>

      <!-- QUIZ CARD 2: Science and Tech Trivia -->
      <g transform="translate(565, 0)">
        <rect width="535" height="270" rx="12" fill="#fee6ba" stroke="#4882ab" stroke-width="1.5" filter="url(#cardElev)" />
        <path d="M 10 0 L 525 0 Q 535 0 535 10 L 535 6 L 0 6 L 0 10 Q 0 0 10 0 Z" fill="#46178f" />

        <rect x="24" y="24" width="84" height="24" rx="12" fill="#e8f5e9" />
        <text x="66" y="40" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="800" fill="#2e7d32" text-anchor="middle">PUBLISHED</text>
        <text x="511" y="40" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#666666" text-anchor="end">3 Questions</text>

        <text x="24" y="78" font-family="'Fredoka', sans-serif" font-size="20px" font-weight="800" fill="#222222">Science and Tech Trivia</text>
        <text x="24" y="106" font-family="'Fredoka', sans-serif" font-size="14.5px" font-weight="500" fill="#666666">Fast-paced team brain challenge with tricky science and</text>
        <text x="24" y="126" font-family="'Fredoka', sans-serif" font-size="14.5px" font-weight="500" fill="#666666">tech questions!</text>

        <rect x="24" y="150" width="487" height="36" rx="6" fill="#f9f9f9" />
        <text x="36" y="173" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#555555">Duration: 50s Total     Points: 3000 Pts</text>

        <line x1="24" y1="202" x2="511" y2="202" stroke="#eeeeee" stroke-width="1" />
        <g transform="translate(24, 214)">
          <rect width="235" height="40" rx="8" fill="#086288" filter="url(#btn3d)" />
          <text x="117" y="25" font-family="'Fredoka', sans-serif" font-size="15.5px" font-weight="700" fill="#fee6ba" text-anchor="middle">Launch Game</text>

          <rect x="250" y="3" width="58" height="34" rx="6" fill="#f0f0f0" stroke="#dddddd" />
          <text x="279" y="25" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#333333" text-anchor="middle">Edit</text>

          <rect x="314" y="3" width="90" height="34" rx="6" fill="#f0f0f0" stroke="#dddddd" />
          <text x="359" y="25" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#333333" text-anchor="middle">Unpublish</text>

          <rect x="410" y="3" width="77" height="34" rx="6" fill="#f0f0f0" stroke="#dddddd" />
          <text x="448" y="25" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#333333" text-anchor="middle">Delete</text>
        </g>
      </g>
    </g>

    <!-- LAUNCH GAME SESSION MODAL PREVIEW (.modal-content, max-width: 520px) -->
    <g transform="translate(290, 415)">
      <rect width="520" height="320" rx="16" fill="#ffffff" stroke="#46178f" stroke-width="2" filter="url(#cardElev)" />

      <!-- .modal-header -->
      <text x="24" y="38" font-family="'Fredoka', sans-serif" font-size="22px" font-weight="800" fill="#46178f">Launch Live Quiz Session</text>
      <text x="496" y="36" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="700" fill="#888888" text-anchor="end">Close</text>

      <!-- .selected-quiz-info -->
      <rect x="24" y="54" width="472" height="52" rx="8" fill="#f5f0ff" stroke="#d4c0f8" />
      <text x="36" y="76" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="800" fill="#46178f">Computer Science &amp; Web Dev Showdown</text>
      <text x="36" y="96" font-family="'Fredoka', sans-serif" font-size="13px" font-weight="600" fill="#555555">5 Questions ready for team battle</text>

      <!-- Team count selector -->
      <text x="24" y="132" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="800" fill="#333333">Select Number of Teams (2 to 4):</text>
      <g transform="translate(24, 144)">
        <rect x="0" y="0" width="148" height="62" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
        <text x="74" y="32" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#26890c" text-anchor="middle">2</text>
        <text x="74" y="52" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#555555" text-anchor="middle">Teams</text>

        <rect x="162" y="0" width="148" height="62" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
        <text x="236" y="32" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#26890c" text-anchor="middle">3</text>
        <text x="236" y="52" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#555555" text-anchor="middle">Teams</text>

        <!-- Selected: 4 Teams -->
        <rect x="324" y="0" width="148" height="62" rx="10" fill="#edf7ee" stroke="#26890c" stroke-width="2" />
        <text x="398" y="32" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#26890c" text-anchor="middle">4</text>
        <text x="398" y="52" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="700" fill="#555555" text-anchor="middle">Teams</text>
      </g>

      <!-- .teams-preview pills -->
      <g transform="translate(24, 218)">
        <rect x="0" y="0" width="110" height="28" rx="14" fill="#fafafa" stroke="#e21b3c" stroke-width="2" />
        <text x="55" y="18" font-family="'Fredoka', sans-serif" font-size="11.5px" font-weight="800" fill="#e21b3c" text-anchor="middle">[R] Red Rockets</text>

        <rect x="118" y="0" width="114" height="28" rx="14" fill="#fafafa" stroke="#1368ce" stroke-width="2" />
        <text x="175" y="18" font-family="'Fredoka', sans-serif" font-size="11.5px" font-weight="800" fill="#1368ce" text-anchor="middle">[B] Blue Blasters</text>

        <rect x="240" y="0" width="114" height="28" rx="14" fill="#fafafa" stroke="#ffa602" stroke-width="2" />
        <text x="297" y="18" font-family="'Fredoka', sans-serif" font-size="11.5px" font-weight="800" fill="#ffa602" text-anchor="middle">[G] Golden Geeks</text>

        <rect x="362" y="0" width="110" height="28" rx="14" fill="#fafafa" stroke="#26890c" stroke-width="2" />
        <text x="417" y="18" font-family="'Fredoka', sans-serif" font-size="11.5px" font-weight="800" fill="#26890c" text-anchor="middle">[V] Green Giants</text>
      </g>

      <!-- .modal-footer -->
      <line x1="24" y1="258" x2="496" y2="258" stroke="#eeeeee" stroke-width="1" />
      <g transform="translate(230, 268)">
        <rect x="0" y="0" width="95" height="38" rx="8" fill="#6c757d" filter="url(#btn3d)" />
        <text x="47" y="24" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="700" fill="#ffffff" text-anchor="middle">Cancel</text>

        <rect x="108" y="0" width="158" height="38" rx="8" fill="#086288" filter="url(#btn3d)" />
        <text x="187" y="24" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="700" fill="#fee6ba" text-anchor="middle">Start Live Lobby</text>
      </g>
    </g>
  </g>

  <!-- .kahoot-footer -->
  <line x1="0" y1="848" x2="1440" y2="848" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="720" y="878" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle">qiuizez • Collaborative Team Quiz Platform</text>
</svg>
