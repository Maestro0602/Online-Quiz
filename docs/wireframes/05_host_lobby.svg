            <rect width="310" height="42" rx="9" fill="#e21b3c" />
            <text x="16" y="27" font-family="'Fredoka', sans-serif" font-size="16px" font-weight="800" fill="#ffffff">[R]  Red Rockets</text>
            <rect x="268" y="9" width="28" height="24" rx="5" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.65)" stroke-width="1" />
