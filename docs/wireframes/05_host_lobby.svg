        <text x="24" y="42" font-family="'Fredoka', sans-serif" font-size="17.5px" font-weight="700" fill="#086288">Join on your phone or browser at room PIN:</text>
        <text x="388" y="51" font-family="'Fredoka', sans-serif" font-size="40px" font-weight="900" fill="#46178f" letter-spacing="5px">739218</text>

