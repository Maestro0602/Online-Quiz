            <text x="22" y="22" font-family="'Fredoka', sans-serif" font-size="10.5px" font-weight="800" fill="#fee6ba" text-anchor="middle">AR</text>
            <text x="42" y="23" font-family="'Fredoka', sans-serif" font-size="14px" font-weight="700" fill="#222222">Alex Rivera</text>
            <rect x="252" y="8" width="102" height="20" rx="10" fill="#e21b3c" />
            <text x="303" y="22" font-family="'Fredoka', sans-serif" font-size="11px" font-weight="800" fill="#ffffff" text-anchor="middle">Red Rockets</text>
            <rect x="364" y="8" width="20" height="20" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5" />
            <text x="374" y="23" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="900" fill="#222222" text-anchor="middle">✓</text>
          </g>

          <!-- Input Row 2: Bella Chen -->
