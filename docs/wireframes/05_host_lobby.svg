            <rect width="396" height="36" rx="8" fill="#f1f1f1" stroke="#e0e0e0" stroke-width="1" />
            <circle cx="22" cy="18" r="12" fill="#4882ab" />
            <text x="22" y="22" font-family="'Fredoka', sans-serif" font-size="10.5px" font-weight="800" fill="#fee6ba" text-anchor="middle">DP</text>
