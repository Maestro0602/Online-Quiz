<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <filter id="btn3d" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="rgba(0,0,0,0.25)" />
    </filter>
    <filter id="hostShadow" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#4882ab" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="rgba(0,0,0,0.35)" />
    </filter>
  </defs>

  <!-- Background: var(--theme-bg-base) = #086288 -->
  <rect width="1440" height="900" fill="#086288" />

  <!-- .kahoot-navbar (App.vue) -->
  <rect width="1440" height="68" fill="#086288" />
  <line x1="0" y1="68" x2="1440" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <g transform="translate(120, 16)">
    <!-- .brand-logo -->
    <text x="0" y="27" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#fee6ba">qiuizez</text>

    <!-- .nav-links -->
    <g transform="translate(860, 0)">
      <rect x="0" y="2" width="102" height="34" rx="6" fill="rgba(255,255,255,0.18)" />
      <text x="51" y="24" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="700" fill="#ffffff" text-anchor="middle">Join Game</text>

      <!-- Sign In (.btn-kahoot .btn-primary .btn-sm) -->
      <rect x="118" y="2" width="88" height="34" rx="8" fill="#086288" stroke="rgba(255,255,255,0.25)" filter="url(#btn3d)" />
      <text x="162" y="24" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="700" fill="#fee6ba" text-anchor="middle">Sign In</text>

      <!-- .theme-toggle-btn -->
      <rect x="222" y="2" width="148" height="34" rx="8" fill="transparent" stroke="#4882ab" stroke-width="1.5" />
      <text x="296" y="24" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#fee6ba" text-anchor="middle">Ocean (Default)  ▼</text>
    </g>
  </g>

  <!-- .home-card .card-kahoot (max-width: 440px, centered in .home-page) -->
  <g transform="translate(500, 165)">
    <rect width="440" height="535" rx="18" fill="#ffffff" stroke="#4882ab" stroke-width="1.5" filter="url(#cardDrop)" />

    <!-- .brand-hero -->
    <text x="220" y="68" font-family="'Fredoka', sans-serif" font-size="42px" font-weight="800" fill="#086288" text-anchor="middle">qiuizez</text>
    <text x="220" y="96" font-family="'Fredoka', sans-serif" font-size="15px" font-weight="600" fill="#086288" opacity="0.8" text-anchor="middle">Enter room PIN to join your team battle</text>

    <!-- .student-input-group -->
    <g transform="translate(28, 128)">
      <text x="0" y="16" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="700" fill="#086288">Your Nickname</text>
      <rect x="0" y="24" width="384" height="54" rx="10" fill="transparent" stroke="#4882ab" stroke-width="1.5" />
      <text x="192" y="58" font-family="'Fredoka', sans-serif" font-size="21px" font-weight="800" fill="#086288" opacity="0.45" text-anchor="middle">e.g. PlayerOne</text>
    </g>

    <!-- .pin-input-group -->
    <g transform="translate(28, 224)">
      <rect x="0" y="0" width="384" height="58" rx="10" fill="transparent" stroke="#4882ab" stroke-width="1.5" />
      <text x="192" y="38" font-family="'Fredoka', sans-serif" font-size="26px" font-weight="800" fill="#086288" opacity="0.45" text-anchor="middle" letter-spacing="4px">Game PIN</text>
    </g>

    <!-- .btn-enter-game (.btn-kahoot .btn-primary) -->
    <g transform="translate(28, 300)">
      <rect width="384" height="56" rx="10" fill="#086288" filter="url(#btn3d)" />
      <text x="192" y="35" font-family="'Fredoka', sans-serif" font-size="19px" font-weight="700" fill="#fee6ba" text-anchor="middle">Enter Room</text>
    </g>

    <!-- .host-shortcut (border-top: 1px solid #4882ab) -->
    <line x1="28" y1="384" x2="412" y2="384" stroke="#4882ab" stroke-width="1" />
    <g transform="translate(28, 404)">
      <rect width="384" height="48" rx="8" fill="#fee6ba" stroke="#4882ab" stroke-width="1.5" filter="url(#hostShadow)" />
      <text x="192" y="30" font-family="'Fredoka', sans-serif" font-size="18px" font-weight="700" fill="#086288" text-anchor="middle">Host</text>
    </g>

    <!-- Authenticated student pill variant preview at bottom of card -->
    <g transform="translate(28, 468)">
      <rect width="384" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3" />
      <text x="192" y="27" font-family="'Fredoka', sans-serif" font-size="12px" font-weight="600" fill="#4882ab" text-anchor="middle">Signed-in variant: [AR] Ready to play as Alex Rivera (Change)</text>
    </g>
  </g>

  <!-- .kahoot-footer (App.vue) -->
  <line x1="0" y1="848" x2="1440" y2="848" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="720" y="878" font-family="'Fredoka', sans-serif" font-size="13.5px" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle">qiuizez • Collaborative Team Quiz Platform</text>
</svg>
